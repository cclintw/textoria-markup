<header>
  <button id="toggleLeft" class="panel-toggle" type="button" title="展開/收合實體清單" aria-label="展開/收合實體清單" aria-expanded="true"></button>
  <div><h1>{{ brand_html | safe }}</h1></div>
  <div class="reader-mode-label" aria-hidden="true"></div>
  <div class="header-actions">
    <button id="addEntity" class="panel-toggle" type="button" title="先選取正文中的未標註文字" aria-label="新增實體：複製選取文字與位置" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="exportHtml" class="panel-toggle" type="button" title="匯出 HTML：複製指令" aria-label="匯出 HTML：複製指令"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M14 2H5a1 1 0 0 0-1 1v18a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V8zM14 2v6h6"/><text x="12" y="16.5" text-anchor="middle" fill="currentColor" stroke="none" font-size="5.5" font-family="sans-serif">HTML</text></svg></button>
    <button id="exportTable" class="panel-toggle" type="button" title="匯出 CSV／Excel：複製指令" aria-label="匯出 CSV／Excel：複製指令"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M14 2H5a1 1 0 0 0-1 1v18a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V8zM14 2v6h6"/><text x="12" y="16.5" text-anchor="middle" fill="currentColor" stroke="none" font-size="5.5" font-family="sans-serif">XLS</text></svg></button>
    <button id="exportDocuxml" class="panel-toggle" type="button" title="匯出 DocuXML：複製指令" aria-label="匯出 DocuXML：複製指令"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M14 2H5a1 1 0 0 0-1 1v18a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V8zM14 2v6h6"/><text x="12" y="16.5" text-anchor="middle" fill="currentColor" stroke="none" font-size="5.5" font-family="sans-serif">DOC</text></svg></button>
    <button id="publishSite" class="panel-toggle" type="button" title="建立 ChatGPT 網站：複製指令" aria-label="建立 ChatGPT 網站：複製指令"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 6.5h14M5 17.5h14"/></svg></button>
    <a id="readerHelp" class="panel-toggle" href="{{ asset_prefix }}help.html" title="操作說明" aria-label="操作說明"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 .5c0 1.5-2.5 2-2.5 3.5"/><path d="M12 16.5h.01"/></svg></a>
    <button id="toggleRight" class="panel-toggle" type="button" title="展開/收合標註資訊" aria-label="展開/收合標註資訊" aria-expanded="true"></button>
  </div>
  <div id="selectionCopyStatus" class="selection-copy-status" role="status" aria-live="polite" hidden></div>
</header>
